<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Planogrid mark">
  <!-- 3x3 grid, center cell hollow — the gap Planogrid detects -->
  <rect x="0"  y="0"  width="28" height="28" rx="6" fill="#F59E0B"/>
  <rect x="34" y="0"  width="28" height="28" rx="6" fill="#F59E0B"/>
  <rect x="68" y="0"  width="28" height="28" rx="6" fill="#F59E0B"/>

  <rect x="0"  y="34" width="28" height="28" rx="6" fill="#F59E0B"/>
  <rect x="34" y="34" width="28" height="28" rx="6" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="68" y="34" width="28" height="28" rx="6" fill="#F59E0B"/>

  <rect x="0"  y="68" width="28" height="28" rx="6" fill="#F59E0B"/>
  <rect x="34" y="68" width="28" height="28" rx="6" fill="#F59E0B"/>
  <rect x="68" y="68" width="28" height="28" rx="6" fill="#F59E0B"/>
</svg>
