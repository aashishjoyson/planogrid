name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Mypy type check
        run: mypy core datasets scripts

      - name: Pytest
        env:
          # No real credentials in CI — dataset-adapter tests mock the
          # network boundary rather than skip. See tests/unit/test_dataset_adapters.py.
          PLANOGRID_PROFILE: cpu
        run: pytest --cov --cov-report=term-missing
